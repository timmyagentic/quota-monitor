name: tests
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: null
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud_development:
    name: Cloud development checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 22
    - name: Detect affected test surfaces
      id: filter
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
        elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "swift-test=true" >> "${GITHUB_OUTPUT}"
          echo "installer-test=true" >> "${GITHUB_OUTPUT}"
          exit 0
        else
          BASE="${{ github.event.before }}"
          HEAD="${GITHUB_SHA}"
        fi

        if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
          echo "swift-test=true" >> "${GITHUB_OUTPUT}"
          echo "installer-test=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        mapfile -t changed < <(git diff --name-only "${BASE}" "${HEAD}")
        printf 'Changed files:\n'
        printf '  %s\n' "${changed[@]}"

        needs_swift_test=false
        needs_installer_test=false
        for path in "${changed[@]}"; do
          case "${path}" in
            .github/workflows/tests.yml|\
            Package.swift|Package.resolved|\
            QuotaMonitor/*|\
            Tests/*|\
            Resources/*|\
            qa/*|\
            tools/*)
              needs_swift_test=true
              ;;
          esac
          case "${path}" in
            .github/workflows/tests.yml|\
            npm/quotamonitor/**)
              needs_installer_test=true
              ;;
          esac
        done

        echo "swift-test=${needs_swift_test}" >> "${GITHUB_OUTPUT}"
        echo "installer-test=${needs_installer_test}" >> "${GITHUB_OUTPUT}"
    - name: Validate PR changelog
      run: python3 tools/validate-pr-changelog.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD
      if: ${{ github.event_name == 'pull_request' }}
    - run: ./qa/bootstrap-cloud.sh
    - run: ./qa/run-cloud.sh
    outputs:
      swift-test: ${{ steps.filter.outputs.swift-test }}
      installer-test: ${{ steps.filter.outputs.installer-test }}
  installer_test:
    name: npm installer checks
    needs:
    - cloud_development
    if: |-
      ${{
        always() &&
        needs.cloud_development.result == 'success' &&
        needs.cloud_development.outputs.installer-test == 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm/quotamonitor
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: npm/quotamonitor/package-lock.json
    - name: Install package dependencies
      run: npm ci --ignore-scripts --force
    - name: Test installer
      run: npm test
    - name: Verify published file allowlist
      run: npm run pack:check
  installer_macos_smoke:
    name: npm installer macOS smoke
    needs:
    - cloud_development
    if: |-
      ${{
        always() &&
        needs.cloud_development.result == 'success' &&
        needs.cloud_development.outputs.installer-test == 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      }}
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm/quotamonitor
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: npm/quotamonitor/package-lock.json
    - name: Install package dependencies
      run: npm ci --ignore-scripts
    - name: Install the delivered app into an isolated directory
      shell: bash
      run: |
        set -euo pipefail
        qm_smoke_dir="$(mktemp -d "${RUNNER_TEMP}/quotamonitor-installer.XXXXXX")"
        output="$(node bin/quotamonitor.js install --app-dir "${qm_smoke_dir}" --no-open)"
        echo "${output}"
        grep -F "Checks: SHA-256, Sparkle Ed25519, Developer ID, Gatekeeper" <<< "${output}"
        test -d "${qm_smoke_dir}/QuotaMonitor.app"
        /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${qm_smoke_dir}/QuotaMonitor.app/Contents/Info.plist"
        /usr/bin/codesign --verify --deep --strict "${qm_smoke_dir}/QuotaMonitor.app"
        /usr/sbin/spctl --assess --type execute --verbose=2 "${qm_smoke_dir}/QuotaMonitor.app"
  macos_swift_test:
    name: macOS Swift tests
    needs:
    - cloud_development
    if: |-
      ${{
        always() &&
        needs.cloud_development.result == 'success' &&
        needs.cloud_development.outputs.swift-test == 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Show toolchain
      run: |
        swift --version
        xcodebuild -version || true
    - name: static QA checks
      run: ./qa/run-static.sh --force
    - name: Upload Swift test log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: swift-test-log-${{ github.run_id }}-${{ github.run_attempt }}
        path: .build/qa-logs/swift-test-*.log
        if-no-files-found: ignore
        retention-days: 7
    - name: swift build -c release (smoke)
      run: swift build -c release
  swift-test:
    name: swift-test
    needs:
    - cloud_development
    - installer_test
    - installer_macos_smoke
    - macos_swift_test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Summarize gated test checks
      shell: bash
      env:
        CLOUD_RESULT: ${{ needs.cloud_development.result }}
        NEEDS_SWIFT_TEST: ${{ needs.cloud_development.outputs.swift-test }}
        NEEDS_INSTALLER_TEST: ${{ needs.cloud_development.outputs.installer-test }}
        MACOS_SWIFT_RESULT: ${{ needs.macos_swift_test.result }}
        INSTALLER_RESULT: ${{ needs.installer_test.result }}
        INSTALLER_SMOKE_RESULT: ${{ needs.installer_macos_smoke.result }}
        IS_DRAFT: ${{ github.event.pull_request.draft || 'false' }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${IS_DRAFT}" == "true" ]]; then
          echo "Draft PR; gated tests intentionally skipped"
          exit 0
        fi
        if [[ "${CLOUD_RESULT}" != "success" ]]; then
          echo "::error::Portable, scope or changelog checks failed"
          exit 1
        fi
        for flag in "${NEEDS_SWIFT_TEST}" "${NEEDS_INSTALLER_TEST}"; do
          case "$flag" in
            true|false) ;;
            *) echo "::error::Unknown change-scope flag"; exit 1 ;;
          esac
        done
        for result in "${MACOS_SWIFT_RESULT}" "${INSTALLER_RESULT}" "${INSTALLER_SMOKE_RESULT}"; do
          case "$result" in
            success|skipped) ;;
            *) echo "::error::A dependent check failed or was cancelled"; exit 1 ;;
          esac
        done
        if [[ "${NEEDS_SWIFT_TEST}" == "true" && "${MACOS_SWIFT_RESULT}" != "success" ]]; then
          echo "::error::Applicable macOS Swift tests did not run successfully"
          exit 1
        fi
        if [[ "${NEEDS_INSTALLER_TEST}" == "true" && ( "${INSTALLER_RESULT}" != "success" || "${INSTALLER_SMOKE_RESULT}" != "success" ) ]]; then
          echo "::error::Applicable installer checks did not run successfully"
          exit 1
        fi
        echo "All applicable checks passed; path skips are not application test results"
  installer_compatibility:
    name: npm installer Node 20 compatibility
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm/quotamonitor
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 20.17.0
        cache: npm
        cache-dependency-path: npm/quotamonitor/package-lock.json
    - name: Install package dependencies
      run: npm ci --ignore-scripts --force
    - name: Test installer
      run: npm test
    - name: Verify published file allowlist
      run: npm run pack:check
permissions:
  contents: read
